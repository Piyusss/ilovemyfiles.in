name: Keep backend awake

# Render's free tier spins the service down after 15 minutes without traffic,
# and a Spring Boot cold start on the free instance can take minutes — which
# looks like the app hanging. Pinging an endpoint that performs a real
# Postgres lookup keeps Render and Neon warm. One always-on free service fits
# inside Render's 750 free instance-hours per month.
#
# Note: GitHub pauses scheduled workflows after ~60 days without repo
# activity; a push or a manual run re-enables them.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend (404 expected; the token lookup touches Postgres)
        run: |
          curl -s -o /dev/null -m 120 \
            -w 'HTTP %{http_code} in %{time_total}s\n' \
            https://ilovemyfiles-in.onrender.com/api/share/keepalive || true
